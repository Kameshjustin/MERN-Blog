name: Frontend deployment to S3 and Cloudfront

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  S3_BUCKET: "mern-github-action043"
  CLOUDFRONT_DISTRIBUTION_ID: "ED2CKC14DICNE"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Check Node & NPM
        run: |
          node -v
          npm -v

      - name: Build
        working-directory: Frontend
        run: |
          npm install
          npm run build

      - name: Verify build output
        run: ls -la Frontend/build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync Frontend/build/ s3://${{ env.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Success Notification
        if: success()
        run: echo "Frontend deployed successfully!"

      - name: Failure Notification
        if: failure()
        run: echo "Frontend deployment failed. Check logs."
